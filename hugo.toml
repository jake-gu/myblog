baseURL = "https://laogutalksai.duckdns.org/"
languageCode = 'zh-cn'
title = '老顾聊AI | 实战 AI 与自动化搞钱生产力'
theme = 'PaperMod'

[params]
  env = 'production'
  title = '老顾聊AI'
  description = '不讲虚的，不买贵的。老顾带你用家用硬件玩转实战 AI 与自动化搞钱生产力！'
